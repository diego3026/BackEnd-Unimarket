[project]
name = "unimarket-api"
version = "2.0.0"
description = "API del marketplace UniMarket (Universidad del Magdalena)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["research", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008", "S101", "S105", "S106", "B904", "UP042", "UP046", "SIM103", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/*" = ["E501", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests", "research"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
