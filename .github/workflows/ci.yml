name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unimarket
          POSTGRES_PASSWORD: unimarket
          POSTGRES_DB: unimarket_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U unimarket" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://unimarket:unimarket@localhost:5432/unimarket_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: pytest
